# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  - name: investigate
    description: "Nghiên cứu sâu một chủ đề theo nhiều góc nhìn: tìm tài liệu, bằng chứng thực tế và hạn chế/phản biện; trả hồ sơ nguồn có ID trích dẫn, đoạn trích theo từng góc nhìn và phần thiếu dữ liệu. Dùng khi user cần nghiên cứu đa chiều. Không dùng cho tra cứu nhanh một câu (lookup), đọc URL (fetch), tìm bài tài khoản (timeline); thiếu chủ đề thì clarify."
    parameters:
      type: object
      properties:
        topic: {type: string, minLength: 1, maxLength: 500, description: "Chủ đề cần nghiên cứu; không được tự đoán nếu user chưa nêu."}
        angles:
          type: array
          minItems: 1
          maxItems: 5
          description: "1–5 câu hỏi/góc nhìn cụ thể. Bỏ qua để dùng tổng quan, bằng chứng ứng dụng và hạn chế/phản biện."
          items: {type: string, minLength: 1, maxLength: 300}
        timeframe: {type: string, enum: [all, day, week, month, year], default: "all", description: "Giới hạn thời gian tìm kiếm; all là không giới hạn."}
        sources_per_angle: {type: integer, minimum: 1, maximum: 5, default: 3, description: "Số kết quả mỗi góc nhìn; mỗi góc tốn một request Tavily."}
      required: [topic]
  - name: deduplicate
    description: "Gộp nguồn trùng URL trong danh sách đã có trước khi tạo digest hoặc khi user yêu cầu bỏ nguồn trùng. Giữ nguồn đầu tiên, bỏ fragment và tracking khi so sánh. Không dùng để tìm kiếm, đọc URL hay xác minh thông tin."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Các nguồn đã thu thập; mỗi nguồn cần URL HTTP(S) tuyệt đối."
          items:
            type: object
            properties:
              url: {type: string, description: "URL HTTP(S) của nguồn"}
              title: {type: string}
              source: {type: string}
              summary: {type: string}
            required: [url]
      required: [items]
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: compare_research
    description: "So sánh 2–3 đối tượng theo cùng 1–3 tiêu chí bằng ma trận bằng chứng Tavily; mỗi ô có excerpt và ID nguồn, ghi rõ ô thiếu dữ liệu. Dùng khi user cần so sánh có dẫn nguồn, khác investigate dành cho nhiều góc của một chủ đề. Không tự chấm điểm hay kết luận người thắng. Thiếu đối tượng/tiêu chí thì clarify; đã có bản nháp cần rà dẫn nguồn thì citation_audit."
    parameters:
      type: object
      properties:
        subjects:
          type: array
          minItems: 2
          maxItems: 3
          items: {type: string, minLength: 1, maxLength: 200}
          description: "2–3 đối tượng khác nhau đã được user nêu, ví dụ PostgreSQL và Elasticsearch."
        criteria:
          type: array
          minItems: 1
          maxItems: 3
          items: {type: string, minLength: 1, maxLength: 200}
          description: "1–3 tiêu chí chung dùng cho mọi đối tượng; không tự đặt yêu cầu thay user."
        timeframe: {type: string, enum: [all, day, week, month, year], default: all, description: "Khoảng thời gian tìm kiếm; all không giới hạn."}
        sources_per_cell: {type: integer, minimum: 1, maximum: 3, default: 2, description: "Số kết quả mỗi ô; tối đa 9 request Tavily cho một tool call."}
      required: [subjects, criteria]

  - name: citation_audit
    description: "Rà dẫn nguồn của bản nháp có sẵn với danh mục {id, url}: tìm [S1] chưa tồn tại, ID mơ hồ, URL sai/trùng, nguồn chưa dùng và đoạn chưa có dẫn nguồn. Chạy local, không truy cập URL, không xác minh đúng/sai claim. Dùng trước khi hoàn thiện/gửi báo cáo nếu user yêu cầu audit; thiếu bản nháp/danh mục thì clarify. Không dùng tìm nguồn mới."
    parameters:
      type: object
      properties:
        draft: {type: string, minLength: 1, maxLength: 50000, description: "Bản nháp dùng [S1], [S1, S2] hoặc [S1; S2]; bỏ qua code khi kiểm tra."}
        sources:
          type: array
          maxItems: 100
          description: "Danh mục nguồn đã thu thập, có thể lấy trực tiếp sources từ investigate/compare_research; [] để tìm toàn bộ ID thiếu."
          items:
            type: object
            properties:
              id: {type: string, pattern: '^S[1-9][0-9]{0,5}$', description: "ID nguồn S1, S2..."}
              url: {type: string, description: "URL HTTP(S) của nguồn."}
              title: {type: string}
            required: [id, url]
      required: [draft, sources]
